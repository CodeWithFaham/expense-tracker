name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Generate missing platform files
        run: |
          cp -r . /tmp/scaffold_backup
          flutter create --platforms=android --project-name expense_tracker --org com.expensetracker .
          cp -r /tmp/scaffold_backup/lib/* lib/
          cp /tmp/scaffold_backup/pubspec.yaml .

      - name: Fix Kotlin version
        run: |
          FILE=""
          if [ -f android/settings.gradle.kts ]; then FILE=android/settings.gradle.kts; fi
          if [ -f android/settings.gradle ]; then FILE=android/settings.gradle; fi
          if [ -n "$FILE" ]; then
            sed -i -E 's/(kotlin\.android["'"'"']?[[:space:]]*\)?[[:space:]]*version[[:space:]]*["'"'"'])[0-9.]+/\11.9.24/' "$FILE"
          fi

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
